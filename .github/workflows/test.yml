name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: './quantum-project/package-lock.json'

      - name: Install dependencies
        working-directory: ./quantum-project
        run: npm ci

      - name: Run type-check and tests
        working-directory: ./quantum-project
        run: npm run test:ci